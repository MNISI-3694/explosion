<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web - Local Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
        }

        .tab.active {
            background: #25D366;
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .admin-btn {
            background: #ff6b00;
        }

        .danger-btn {
            background: #ff4444;
        }

        .user-list {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .user-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hidden {
            display: none;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }

        .success {
            background: #e8f5e8;
            color: #25D366;
            border: 1px solid #25D366;
        }

        .error {
            background: #ffe8e8;
            color: #ff4444;
            border: 1px solid #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #25D366; margin-bottom: 20px;">📱 WhatsApp Web Clone</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="showSection('signup')">Jisajili</button>
            <button class="tab" onclick="showSection('admin')">Admin Panel</button>
            <button class="tab" onclick="showSection('view')">Angalia Data</button>
        </div>

        <!-- Signup Section -->
        <div id="signupSection">
            <h2>🌟 Jisajili Akaunti Mpya</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label>👤 Jina Kamili</label>
                    <input type="text" id="name" required placeholder="Weka jina lako kamili">
                </div>
                <div class="form-group">
                    <label>📞 Namba ya Simu</label>
                    <input type="tel" id="phone" required placeholder="+255 XXX XXX XXX">
                </div>
                <div class="form-group">
                    <label>📧 Barua Pepe (Hiari)</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>🌍 Nchi</label>
                    <select id="country" required>
                        <option value="">Chagua nchi yako</option>
                        <option value="Tanzania">Tanzania</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Uganda">Uganda</option>
                        <option value="Rwanda">Rwanda</option>
                        <option value="Other">Nyingine</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>🔒 Nenosiri</label>
                    <input type="password" id="password" required placeholder="Chagua nenosiri">
                </div>
                <button type="submit" class="btn">💾 Hifadhi Data</button>
            </form>
            <div id="signupMessage" class="message hidden"></div>
        </div>

        <!-- Admin Section -->
        <div id="adminSection" class="hidden">
            <h2>👑 Admin Panel</h2>
            <div class="form-group">
                <label>🔐 Nenosiri la Admin</label>
                <input type="password" id="adminPassword" placeholder="Weka nenosiri la admin">
            </div>
            <button class="btn admin-btn" onclick="loginAdmin()">Ingia kama Admin</button>
            
            <div id="adminPanel" class="hidden">
                <h3>📊 Watumiaji Waliosajiliwa: <span id="userCount">0</span></h3>
                
                <div style="margin: 15px 0;">
                    <button class="btn admin-btn" onclick="downloadUsers()">📥 Pakua Data (JSON)</button>
                    <button class="btn admin-btn" onclick="showUsers()">👁️ Angalia Data Hapa</button>
                    <button class="btn danger-btn" onclick="clearAllUsers()">🗑️ Futa Data Zote</button>
                </div>

                <div class="user-list" id="userList">
                    <!-- Users will appear here -->
                </div>
            </div>
        </div>

        <!-- View Data Section -->
        <div id="viewSection" class="hidden">
            <h2>📋 Data ya Watumiaji</h2>
            <div style="margin-bottom: 15px;">
                <button class="btn" onclick="copyToClipboard()">📋 Nakili Data</button>
                <button class="btn" onclick="showSection('admin')">⬅️ Rudi kwa Admin</button>
            </div>
            <div id="dataDisplay"></div>
        </div>
    </div>

    <script>
        // ==================== SYSTEM YA KUFANYA KAZI ====================
        
        // 1. ONYESHA SEHEMU ZA TOVUTI
        function showSection(sectionName) {
            // Ficha sehemu zote
            document.getElementById('signupSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('viewSection').classList.add('hidden');
            
            // Weka tabu zisizo-active
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            // Onyesha sehemu inayotakiwa
            document.getElementById(sectionName + 'Section').classList.remove('hidden');
            
            // Weka tabu kuwa active
            event.target.classList.add('active');
        }

        // 2. PATA WATUMIAJI KUTOKA LOCALSTORAGE
        function getUsers() {
            const users = localStorage.getItem('whatsappUsers');
            return users ? JSON.parse(users) : [];
        }

        // 3. HIFADHI MTUMIAJI MPYA
        function saveUser(user) {
            const users = getUsers();
            
            // Angalia kama namba ya simu tayari ipo
            const userExists = users.find(u => u.phone === user.phone);
            if (userExists) {
                showMessage('signupMessage', '❌ Namba hii ya simu tayari imesajiliwa!', 'error');
                return false;
            }
            
            // Ongeza mtumiaji mpya
            users.push({
                ...user,
                id: Date.now(), // ID ya kipekee
                timestamp: new Date().toLocaleString('sw-TZ'),
                ip: 'N/A' // Kwa hali halisi, ingeweza kupata IP
            });
            
            // Hifadhi kwenye localStorage
            localStorage.setItem('whatsappUsers', JSON.stringify(users));
            return true;
        }

        // 4. ONYESHA TAARIFA
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${type}`;
            element.classList.remove('hidden');
            
            // Futa taarifa baada ya sekunde 5
            setTimeout(() => {
                element.classList.add('hidden');
            }, 5000);
        }

        // 5. USAJILI WA MTUMIAJI MPYA
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                country: document.getElementById('country').value,
                password: document.getElementById('password').value
            };

            if (saveUser(user)) {
                showMessage('signupMessage', '✅ Umefanikiwa kusajiliwa! Data imehifadhiwa.', 'success');
                this.reset();
            }
        });

        // 6. MFUMO WA ADMIN
        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            
            // 🔐 BADILISHA NENOSIRI HAPA IKIWA UNAITAKA
            if (password === 'admin123') {
                document.getElementById('adminPanel').classList.remove('hidden');
                loadUsers();
            } else {
                alert('❌ Nenosiri la admin si sahihi!');
            }
        }

        // 7. PAKUA ORODHA YA WATUMIAJI
        function loadUsers() {
            const users = getUsers();
            const userList = document.getElementById('userList');
            const userCount = document.getElementById('userCount');
            
            userCount.textContent = users.length;
            
            if (users.length === 0) {
                userList.innerHTML = '<p style="text-align: center; color: #666;">Hakuna watumiaji waliosajiliwa bado.</p>';
                return;
            }

            userList.innerHTML = users.map(user => `
                <div class="user-item">
                    <div style="flex: 1;">
                        <strong>${user.name}</strong><br>
                        <small>📱 ${user.phone}</small><br>
                        <small>📧 ${user.email || 'Hakuna'}</small><br>
                        <small>🌍 ${user.country} | 📅 ${user.timestamp}</small>
                    </div>
                    <button onclick="deleteUser(${user.id})" class="danger-btn" style="padding: 5px 10px; font-size: 12px;">Futa</button>
                </div>
            `).join('');
        }

        // 8. FUTA MTUMIAJI
        function deleteUser(userId) {
            if (confirm('Una uhakika unataka kufuta mtumiaji huyu?')) {
                const users = getUsers().filter(user => user.id !== userId);
                localStorage.setItem('whatsappUsers', JSON.stringify(users));
                loadUsers();
                showMessage('signupMessage', '✅ Mtumiaji amefutwa!', 'success');
            }
        }

        // 9. PAKUA DATA YA WATUMIAJI
        function downloadUsers() {
            const users = getUsers();
            const data = JSON.stringify(users, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `whatsapp_users_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 10. ONYESHA DATA HAPA
        function showUsers() {
            const users = getUsers();
            const dataDisplay = document.getElementById('dataDisplay');
            showSection('view');
            
            if (users.length === 0) {
                dataDisplay.innerHTML = '<p>Hakuna data ya watumiaji.</p>';
                return;
            }

            dataDisplay.innerHTML = `
                <div style="background: #f8f8f8; padding: 15px; border-radius: 5px; margin-bottom: 15px;">
                    <strong>Jumla ya Watumiaji: ${users.length}</strong> | 
                    <strong>Mwisho kusasishwa: ${new Date().toLocaleString('sw-TZ')}</strong>
                </div>
                <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap;">${JSON.stringify(users, null, 2)}</pre>
            `;
        }

        // 11. NAKILI DATA
        function copyToClipboard() {
            const users = getUsers();
            const dataText = JSON.stringify(users, null, 2);
            navigator.clipboard.writeText(dataText).then(() => {
                alert('✅ Data imenakiliwa kwenye clipboard!');
            }).catch(() => {
                alert('❌ Shida kwa kunakili data. Jaribu tena.');
            });
        }

        // 12. FUTA DATA ZOTE
        function clearAllUsers() {
            if (confirm('🚨 UNAHAKIKA UNATAKA KUFUTA DATA YOTE YA WATUMIAJI?\nHATUA HII HAITATENDULIWA!')) {
                localStorage.removeItem('whatsappUsers');
                loadUsers();
                showMessage('signupMessage', '✅ Data zote zimefutwa!', 'success');
            }
        }

        // 13. ANZISHA TOVUTI
        showSection('signup');
    </script>
</body>
</html>
